name: Build and push quannet-ssl image

# Builds docker/ssl/Dockerfile and pushes it to GHCR on GitHub's own runners.
# Exists because building it on a home/office connection is unreliable for
# the ~3GB pytorch/pytorch CUDA base layer (repeatedly stalled downloading
# it locally) - GitHub Actions has fast, reliable network straight to GHCR,
# and RunPod then pulls the finished image directly (no nested docker build
# needed inside a RunPod pod, which doesn't support it without a privileged
# template anyway).

on:
  push:
    branches: [main]
    paths:
      - 'docker/ssl/Dockerfile'
      - 'src/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'setup.cfg'
      - '.github/workflows/build-ssl-image.yml'
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/ssl/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/quannet-ssl:latest
            ghcr.io/${{ github.repository_owner }}/quannet-ssl:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
