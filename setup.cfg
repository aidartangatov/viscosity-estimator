[metadata]
name = quannet
description_file = README.md

[flake8]
max-line-length = 121
docstring-convention = google
exclude = .git,__pycache__,
application-import-names = quannet
import-order-style = pycharm
# E203 (whitespace before ':') conflicts with black's slice formatting - black's
# own docs recommend ignoring it rather than fighting the formatter.
extend-ignore = E203

[isort]
profile = black
line_length = 121
skip_gitignore = True
known_first_party = quannet
known_torch = torch
known_lightning = lightning
known_pandas = pandas
known_numpy = numpy
force_alphabetical_sort = True
sections = FUTURE,STDLIB,THIRDPARTY,PANDAS,NUMPY,TORCH,LIGHTNING,FIRSTPARTY,LOCALFOLDER
no_lines_before = LOCALFOLDER,PANDAS,NUMPY,TORCH,LIGHTNING
length_sort = True
