[metadata]
name = quannet
version = attr: quannet.__version__

[options]
package_dir =
    = src
packages = find:
install_requires =
    tqdm == 4.66.1
    pyyaml == 6.0.1
    pandas == 1.3.3
    torch == 2.0.1
    lightning == 2.0.7
    biopython == 1.79
    pdb2pqr == 3.4.1

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    quannet = quannet.config:entrypoint

[flake8]
max-line-length = 121
docstring-convention = google
exclude = APBS-3.4.1.Linux,.git,__pycache__,
application-import-names = quannet
import-order-style = pycharm

[isort]
profile=black
line_length=121
skip_gitignore=True
known_first_party=quannet
known_torch=torch
known_lightning=lightning
known_pandas=pandas
known_numpy=numpy
sections=FUTURE,STDLIB,THIRDPARTY,PANDAS,NUMPY,TORCH,LIGHTNING,FIRSTPARTY,LOCALFOLDER
no_lines_before=LOCALFOLDER,PANDAS,NUMPY,TORCH,LIGHTNING
length_sort=True
